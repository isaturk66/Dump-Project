# .github/workflows/build-binaries.yml
name: Build & Publish Binaries

on:
  push:
    tags: ["v*.*.*"]    # build only when you create a version tag
  workflow_dispatch:     # or run manually

permissions:          # <-- top-level (applies to all jobs)
  contents: write     #   just enough for a release

jobs:
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Add/remove rows to taste
          - os: ubuntu-latest
            artifact_name: dump_project-linux
          - os: macos-latest
            artifact_name: dump_project-macos
          - os: windows-latest
            artifact_name: dump_project-win.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # pin the version you support

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.6.0   # or a pinned version

      - name: Build single-file binary
        run: |
          pyinstaller --onefile dump_project.py
          # Move/rename so each platform artifact has a unique name
          mkdir staging
          mv dist/* "staging/${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/

  # optional: attach binaries directly to a GitHub Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # only on tagged commits
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*          # every artifact from matrix
