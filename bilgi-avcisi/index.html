<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilgi Avcısı</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;display:flex;justify-content:center;padding:20px}.w{width:min(950px,100%)}h1{margin:0}.sub{color:#b6c2d6;margin:6px 0 14px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.s{background:#1e293b;padding:8px 12px;border-radius:12px}.game{position:relative;height:500px;overflow:hidden;border:1px solid #334155;border-radius:20px;background:linear-gradient(#111827 0 64%,#334322 64%);outline:none}.moon{position:absolute;width:70px;height:70px;border-radius:50%;background:#eee8cf;right:30px;top:25px}.player{position:absolute;bottom:28px;transform:translateX(-50%);font-size:58px;z-index:4}.fact{position:absolute;top:-50px;padding:8px 10px;border-radius:12px;background:#f1e4ac;color:#222;border:2px solid #cdb85a;font-weight:700;font-size:12px}.ov{position:absolute;inset:0;background:#020617dd;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.ov.show{display:flex}.q{width:min(520px,100%);background:#1e293b;border:1px solid #334155;border-radius:18px;padding:20px}.ans{width:100%;text-align:left;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #475569;background:#26354d;color:#fff;font-weight:700}.ctrl{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}button{min-height:46px;padding:0 15px;border-radius:12px;border:1px solid #475569;background:#26354d;color:white;font-weight:700;cursor:pointer}.brain{margin-top:16px;background:#182235;border:1px solid #334155;border-radius:15px;padding:12px}.net{position:relative;width:160px;height:100px;margin:auto;background:#26354d;border-radius:48%}.node{position:absolute;width:10px;height:10px;border-radius:50%;background:#93c5fd;transform:translate(-50%,-50%)}.wire{position:absolute;height:2px;background:#86efac;transform-origin:left center}
</style><body><div class="w"><h1>🏹 Bilgi Avcısı</h1><div class="sub">Uçuşan bilgileri yakala, tarih sorularını çöz, beynindeki bağlantıları artır.</div><div class="stats"><div class="s">Yakalanan: <b id="caught">0</b></div><div class="s">🧠 Bağlantı: <b id="links">0</b></div><div class="s"><b id="level">Seviye 1</b></div></div><div id="game" class="game" tabindex="0"><div class="moon"></div><div id="player" class="player">🏹</div><div id="ov" class="ov"><div class="q"><div style="color:#aab5c8;font-size:13px">TARİH SORUSU</div><h2 id="qt"></h2><div id="answers"></div><div id="fb" style="margin-top:12px;font-weight:700"></div></div></div></div><div class="ctrl"><button id="l">◀ Sola</button><button id="p">Duraklat</button><button id="r">Sağa ▶</button><button id="restart">Yeniden Başlat</button></div><div class="brain"><b>Sinir ağı</b><div id="net" class="net"></div></div></div><script>
(()=>{const game=document.getElementById('game'),player=document.getElementById('player'),ov=document.getElementById('ov'),qt=document.getElementById('qt'),answers=document.getElementById('answers'),fb=document.getElementById('fb'),caughtEl=document.getElementById('caught'),linksEl=document.getElementById('links'),levelEl=document.getElementById('level'),net=document.getElementById('net'),pause=document.getElementById('p');const qs=[['İstanbul hangi yıl fethedildi?',['1453','1492','1389','1517'],0],['Fransız Devrimi hangi yıl başladı?',['1776','1789','1815','1848'],1],['Türkiye Cumhuriyeti hangi yıl ilan edildi?',['1919','1920','1922','1923'],3],['Berlin Duvarı hangi yıl yıkıldı?',['1979','1985','1989','1991'],2],['Kadeş Antlaşması hangi iki güç arasında yapıldı?',['Roma–Kartaca','Hitit–Mısır','Pers–Yunan','Bizans–Sasani'],1],['Matbaanın Avrupa’da yaygınlaşmasıyla özdeşleşen kişi kimdir?',['Galileo','Gutenberg','Newton','Da Vinci'],1]];const labs=['KRONİK','HARİTA','BELGE','ARŞİV','KEŞİF'];let x=.5,caught=0,links=0,running=true,open=false,items=[],last=0,prev=0,keys={l:false,r:false};function up(){player.style.left=x*100+'%'}function spawn(){let e=document.createElement('div');e.className='fact';e.textContent='✦ '+labs[Math.random()*labs.length|0];let o={e,x:.08+Math.random()*.84,y:-50,s:70+Math.random()*30+Math.floor(links/5)*8};game.appendChild(e);items.push(o)}function rem(o){o.e.remove();items=items.filter(v=>v!==o)}function ask(){open=true;running=false;ov.classList.add('show');answers.innerHTML='';fb.textContent='';let q=qs[Math.random()*qs.length|0];qt.textContent=q[0];q[1].forEach((t,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=String.fromCharCode(65+i)+') '+t;b.onclick=()=>ans(q,i);answers.appendChild(b)})}function ans(q,i){[...answers.children].forEach(b=>b.disabled=true);if(i===q[2]){links++;linksEl.textContent=links;fb.textContent='✓ Doğru! Yeni bir bağlantı oluştu.';fb.style.color='#86efac';brain()}else{fb.textContent='✗ Yanlış. Doğru cevap: '+q[1][q[2]];fb.style.color='#fca5a5'}levelEl.textContent='Seviye '+(1+Math.floor(links/5));setTimeout(()=>{ov.classList.remove('show');open=false;running=true;game.focus()},900)}function brain(){net.innerHTML='';let pts=[],n=Math.min(2+links,18);for(let i=0;i<n;i++){let a=i*2.4,r=10+Math.sqrt(i)*13;pts.push({x:80+Math.cos(a)*r,y:50+Math.sin(a)*r*.7})}for(let i=1;i<pts.length;i++){let a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y,w=document.createElement('div');w.className='wire';w.style.left=a.x+'px';w.style.top=a.y+'px';w.style.width=Math.hypot(dx,dy)+'px';w.style.transform='rotate('+Math.atan2(dy,dx)*180/Math.PI+'deg)';net.appendChild(w)}pts.forEach(p=>{let n=document.createElement('div');n.className='node';n.style.left=p.x+'px';n.style.top=p.y+'px';net.appendChild(n)})}function frame(t){let dt=Math.min((t-prev)/1000,.04)||0;prev=t;if(running&&!open){x=Math.max(.06,Math.min(.94,x+((keys.r?1:0)-(keys.l?1:0))*dt*.72));up();if(t-last>Math.max(650,1450-links*20)){spawn();last=t}let h=game.clientHeight;for(let o of [...items]){o.y+=o.s*dt;o.e.style.left=o.x*100+'%';o.e.style.top=o.y+'px';let py=h-115;if(o.y>py-30&&o.y<py+60&&Math.abs(o.x-x)<.075){caught++;caughtEl.textContent=caught;rem(o);ask();break}if(o.y>h+40)rem(o)}}requestAnimationFrame(frame)}game.onkeydown=e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();keys.l=true}if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();keys.r=true}};game.onkeyup=e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.l=false;if(['ArrowRight','d','D'].includes(e.key))keys.r=false};function hold(id,k){let b=document.getElementById(id);b.onpointerdown=()=>keys[k]=true;['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}hold('l','l');hold('r','r');pause.onclick=()=>{if(open)return;running=!running;pause.textContent=running?'Duraklat':'Devam Et'};document.getElementById('restart').onclick=()=>{items.forEach(o=>o.e.remove());items=[];caught=links=0;x=.5;caughtEl.textContent=linksEl.textContent='0';levelEl.textContent='Seviye 1';ov.classList.remove('show');open=false;running=true;pause.textContent='Duraklat';up();brain();game.focus()};up();brain();game.focus();requestAnimationFrame(frame)})();
</script></body></html>
